name: Checks and container releases

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Payload_Type/mythic_beaconcrypt
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mythic_test
          POSTGRES_PASSWORD: mythic-integration-only
          POSTGRES_DB: mythic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mythic_test -d mythic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: provider_test
          RABBITMQ_DEFAULT_PASS: transport-tests-only
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Check copied crypto-provider template
        working-directory: .
        run: python3 scripts/check-template.py
      - name: Check release automation
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_release.py' -v
      - name: Offline installed Poseidon matrix tests
        working-directory: .
        run: python3 -m unittest discover -s integration/poseidon/installed -p 'test_*.py' -v
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: Payload_Type/mythic_beaconcrypt/go.sum
      - name: Install native link and release-download tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential ca-certificates curl coreutils util-linux ripgrep
      - name: Check out Poseidon source for native archive tests
        uses: actions/checkout@v6
        with:
          repository: 0xd6cb6d73/poseidon
          ref: crypto-shim
          path: .build/poseidon-source
      - name: Offline native release archive tests
        working-directory: .
        env:
          POSEIDON_SOURCE: ${{ github.workspace }}/.build/poseidon-source
        run: |
          test -f "$POSEIDON_SOURCE/Payload_Type/poseidon/scripts/build-native.sh"
          test -f "$POSEIDON_SOURCE/Payload_Type/poseidon/scripts/beaconcrypt-releases.txt"
          python3 -m unittest discover -s integration/poseidon -p test_native_artifacts.py -v
      - name: Download Go dependencies
        run: go mod download
      - name: Verify pinned Beaconcrypt release archive
        run: |
          ./scripts/build-native.sh
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${GITHUB_WORKSPACE}/Payload_Type/mythic_beaconcrypt/.build/native-target/release" >> "$GITHUB_ENV"
      - name: Check Go formatting
        run: make -C ../.. fmt-check
      - name: Vet
        run: go vet ./...
      - name: Unit and native tests
        # Go's build cache does not track external static archives.
        run: go test -a -race ./...
      - name: SDK lifecycle tests
        env:
          BEACONCRYPT_AMQP_TEST_URL: amqp://provider_test:transport-tests-only@127.0.0.1:5672/
        run: make test-transport
      - name: Check vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.4.0
          govulncheck ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: Payload_Type/mythic_beaconcrypt
          args: --config ../../.golangci.yml
      - name: Check out Mythic server source
        uses: actions/checkout@v6
        with:
          repository: 0xd6cb6d73/Mythic
          ref: crypto-shim
          path: .build/mythic-source
      - name: Real Mythic and Beaconcrypt client integration tests
        env:
          MYTHIC_SOURCE: ${{ github.workspace }}/.build/mythic-source
          MYTHIC_REF: HEAD
          BEACONCRYPT_AMQP_TEST_URL: amqp://provider_test:transport-tests-only@127.0.0.1:5672/
          CRYPTO_PROVIDER_TEST_DSN: postgres://mythic_test:mythic-integration-only@127.0.0.1:5432/mythic_test?sslmode=disable
        run: make test-integration

  image:
    name: Build and release container image
    needs: check
    # Build failed-check pushes too; release publication still requires success.
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ${{ (github.ref == 'refs/heads/main' || github.ref_type == 'tag') && 'container-release' || format('container-build-{0}', github.run_id) }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Select image version
        id: image
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          CHECK_RESULT: ${{ needs.check.result }}
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA}"
          publish=false
          automatic=false
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ ! "$REF_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
              printf '%s\n' '::error::Git tag must be a valid container tag (1-128 letters, digits, underscores, dots or hyphens; start with a letter, digit or underscore).'
              exit 1
            fi
            version=$REF_NAME
            if [[ "$CHECK_RESULT" == success ]]; then
              publish=true
            fi
          elif [[ "$REF_NAME" == main && "$CHECK_RESULT" == success && "$ACTOR" != 'github-actions[bot]' ]]; then
            version="v0.1.${GITHUB_RUN_NUMBER}"
            publish=true
            automatic=true
          fi
          printf 'name=%s\nversion=%s\npublish=%s\nautomatic=%s\n' "$image" "$version" "$publish" "$automatic" >> "$GITHUB_OUTPUT"
      - name: Prepare signed release configuration
        id: release
        if: steps.image.outputs.automatic == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
        run: python3 scripts/release.py prepare
      - name: Check out prepared release commit
        if: steps.image.outputs.automatic == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.release.outputs.commit }}
      - name: Validate tagged installation image
        if: github.ref_type == 'tag'
        env:
          EXPECTED_IMAGE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ['EXPECTED_IMAGE']
          config = json.loads(Path('config.json').read_text())
          actual = config.get('remote_images', {}).get('mythic_beaconcrypt')
          if actual != expected:
              raise SystemExit(f'config.json remote_images.mythic_beaconcrypt must be {expected!r}; commit it before creating this tag')
          PY
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        if: steps.release.outputs.released != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Payload_Type/mythic_beaconcrypt
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.commit || github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          # Complete branch builds as local OCI archives; tags use the registry exporter.
          outputs: ${{ steps.image.outputs.publish == 'true' && 'type=registry' || format('type=oci,dest={0}/mythic-beaconcrypt.oci.tar', runner.temp) }}
          provenance: mode=max
          cache-from: type=gha,scope=mythic-beaconcrypt-image
          cache-to: type=gha,mode=max,scope=mythic-beaconcrypt-image
      - name: Install Cosign
        if: steps.image.outputs.publish == 'true'
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0
        with:
          cosign-release: v3.1.3
      - name: Sign and verify published image
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RELEASED: ${{ steps.release.outputs.released }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
        shell: bash
        run: |
          image="${IMAGE_NAME}:${IMAGE_VERSION}"
          if [[ "$RELEASED" != true ]]; then
            image="${IMAGE_NAME}@${IMAGE_DIGEST}"
            cosign sign --yes "$image"
          fi
          cosign verify "$image" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Promote verified release
        if: steps.image.outputs.automatic == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.image.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: python3 scripts/release.py finalize
